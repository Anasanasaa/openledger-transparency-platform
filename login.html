<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenLedger — Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Login Page -->
<div class="login-page">
  <div class="login-bg"></div>

  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <div class="login-logo-icon">📒</div>
      <div class="login-logo-text">Open<span>Ledger</span></div>
    </div>

    <h1 class="login-heading">Welcome back</h1>
    <p class="login-sub">Sign in to manage transparent campaigns</p>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email address</label>
        <input class="form-input" type="email" id="loginEmail"
               placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <input class="form-input" type="password" id="loginPassword"
               placeholder="Enter your password" autocomplete="current-password" required />
      </div>

      <!-- Error message -->
      <p id="loginError" style="color:var(--red);font-size:13px;margin-bottom:12px;"></p>

      <button type="submit" class="btn btn-primary btn-full">Sign In →</button>
    </form>

    <!-- Demo credentials hint -->
    <div class="login-demo">
      <span>Demo account: </span>
      <strong>aarav@openledger.in</strong> / <strong>demo123</strong>
      <br/>
      <button id="fillDemo" class="btn btn-outline btn-sm" style="margin-top:10px;width:100%;">
        Fill Demo Credentials
      </button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
